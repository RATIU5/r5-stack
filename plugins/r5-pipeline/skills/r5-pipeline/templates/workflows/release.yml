name: release

on:
  push:
    branches: [BRANCH]

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  MISE_LOCKED: "1"

jobs:
  release:
    if: "contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@SHA
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@SHA
      - run: mise run build
      - uses: actions/attest@SHA
        with:
          subject-path: dist/*
      - run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
