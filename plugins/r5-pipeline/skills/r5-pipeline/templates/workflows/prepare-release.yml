name: prepare-release

on:
  push:
    branches: [BRANCH]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release label, empty for a stable release
        type: choice
        options: ["", alpha, beta, rc]
        default: ""

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  MISE_LOCKED: "1"

jobs:
  prepare:
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@SHA
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
      - uses: jdx/mise-action@SHA
      - run: mise run release:prepare -- ${{ inputs.prerelease && format('--prerelease-label {0}', inputs.prerelease) }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
