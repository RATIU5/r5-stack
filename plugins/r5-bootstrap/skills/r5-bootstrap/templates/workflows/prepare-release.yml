name: prepare-release

on:
  push:
    branches: [BRANCH]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Pre-release label, empty for a stable release
        type: choice
        options: ["", alpha, beta, rc]
        default: ""

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions: {}

env:
  MISE_LOCKED: "1"

jobs:
  prepare:
    permissions:
      contents: write
      pull-requests: write
    if: "!contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@SHA
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
      - uses: jdx/mise-action@SHA
      - id: pending
        run: if ls .changeset/*.md > /dev/null 2>&1; then echo found=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.found == 'true'
        run: mise run release:prepare -- ${PRERELEASE:+--prerelease-label "$PRERELEASE"}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
