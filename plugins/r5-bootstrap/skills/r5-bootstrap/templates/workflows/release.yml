name: release

on:
  push:
    branches: [BRANCH]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_LOCKED: "1"

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@SHA
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@SHA
      - id: pending
        run: if [ -n "$(mise run -q release:publish -- --dry-run)" ]; then echo found=true >> "$GITHUB_OUTPUT"; fi
      - if: steps.pending.outputs.found == 'true'
        run: mise run build
      - if: steps.pending.outputs.found == 'true'
        uses: actions/attest@SHA
        with:
          subject-path: dist/*
      - if: steps.pending.outputs.found == 'true'
        run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
