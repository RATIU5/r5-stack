name: release

on:
  push:
    branches: [BRANCH]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  MISE_LOCKED: "1"

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: "contains(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@SHA
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@SHA
      - run: mise run build
      - uses: actions/attest@SHA
        with:
          subject-path: dist/*
      - run: mise run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
